<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17181b">
<title>기록 복구 — 케어노트</title>
<style>
:root{ color-scheme: dark;
  --ground:#17181b; --surface:#1e1f23; --surface2:#26282d;
  --hair:rgba(231,232,234,.12); --hair2:rgba(231,232,234,.24);
  --ink:#e7e8ea; --soft:#9a9ea6; --faint:#6b6f78; --accent:#5ba0d8; --ok:#6fbf85; --warn:#e0ab4c; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;padding:26px 18px 80px}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:21px;margin:0 0 6px}
.sub{color:var(--soft);font-size:13.5px;margin:0 0 22px}
.note{background:var(--surface);border:1px solid var(--hair);border-left:3px solid var(--accent);
  border-radius:9px;padding:13px 15px;font-size:13.5px;color:var(--soft);margin-bottom:22px}
button{font:inherit;color:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--hair2);
  background:var(--surface2);padding:13px 20px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:#0d1520;border-color:var(--accent);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
#out{margin-top:8px}
.item{background:var(--surface);border:1px solid var(--hair);border-radius:10px;padding:13px 15px;margin-bottom:10px}
.item .k{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--accent);word-break:break-all}
.item .m{font-size:13px;color:var(--soft);margin-top:6px}
.big{color:var(--ok);font-weight:600}
.none{color:var(--faint)}
.warn{color:var(--warn)}
.status{font-size:14px;margin:14px 0;padding:12px 14px;border-radius:9px;background:var(--surface);border:1px solid var(--hair)}
</style>
</head>
<body>
<div class="wrap">
  <h1>기록 복구</h1>
  <p class="sub">이 기기에 남아 있는 케어노트 작업 기록을 찾아서 파일로 저장합니다.</p>

  <div class="note">
    이 페이지는 <b>읽기만 합니다.</b> 아무것도 수정하거나 서버로 보내지 않습니다.<br>
    찾은 내용은 이 기기에 파일로만 저장되고, 그 파일을 직접 전달해 주시면 됩니다.
  </div>

  <div class="row">
    <button class="primary" id="scan">기록 찾기</button>
    <button id="save" disabled>파일로 저장</button>
  </div>

  <div id="status"></div>
  <div id="out"></div>
</div>

<script>
var FOUND = null;

function esc(s){ return String(s).replace(/[&<>]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]; }); }
function kb(n){ return n>=1048576 ? (n/1048576).toFixed(1)+" MB" : (n/1024).toFixed(0)+" KB"; }
function when(t){ if(!t) return "시각 모름"; try{ return new Date(t).toLocaleString("ko-KR"); }catch(e){ return String(t); } }

function summarize(state){
  if(!state || typeof state!=="object") return null;
  var cards = state.cards;
  var n = cards ? (Array.isArray(cards) ? cards.length : Object.keys(cards).length) : 0;
  var imgs = 0, texts = [];
  var list = cards ? (Array.isArray(cards) ? cards : Object.keys(cards).map(function(k){return cards[k];})) : [];
  list.forEach(function(c){
    if(!c || typeof c!=="object") return;
    if(c.type === "image" || c.src || c.img) imgs++;
    var t = c.text || c.title || "";
    if(typeof t === "string" && t.trim()) texts.push(t.trim().split("\n")[0].slice(0,28));
  });
  return { title: state.title || "(제목 없음)", cards: n, images: imgs, samples: texts.slice(0,8) };
}

function readIDB(){
  return new Promise(function(resolve){
    var out = [];
    if(!window.indexedDB) return resolve(out);
    var rq;
    try { rq = indexedDB.open("carenote-draft"); } catch(e){ return resolve(out); }
    rq.onerror = function(){ resolve(out); };
    rq.onsuccess = function(){
      var db = rq.result;
      var names = [].slice.call(db.objectStoreNames);
      if(!names.length){ db.close(); return resolve(out); }
      var tx, st;
      try { tx = db.transaction(names, "readonly"); st = tx.objectStore(names[0]); }
      catch(e){ db.close(); return resolve(out); }
      var c = st.openCursor();
      c.onsuccess = function(e){
        var cur = e.target.result;
        if(cur){ out.push({ source:"IndexedDB", key:String(cur.key), value:cur.value }); cur.continue(); }
        else { db.close(); resolve(out); }
      };
      c.onerror = function(){ db.close(); resolve(out); };
    };
  });
}

document.getElementById("scan").addEventListener("click", async function(){
  var btn = this; btn.disabled = true; btn.textContent = "찾는 중…";
  var st = document.getElementById("status"), out = document.getElementById("out");
  st.textContent = ""; out.innerHTML = "";
  var found = [];

  try {
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(!k) continue;
      if(k.indexOf("contiboard") !== 0 && k.indexOf("carenote") !== 0) continue;
      var raw = localStorage.getItem(k);
      var val; try { val = JSON.parse(raw); } catch(e){ val = raw; }
      found.push({ source:"localStorage", key:k, value:val, bytes:(raw||"").length });
    }
  } catch(e){}

  try {
    for(var j=0;j<sessionStorage.length;j++){
      var sk = sessionStorage.key(j);
      if(!sk) continue;
      if(sk.indexOf("contiboard") !== 0 && sk.indexOf("carenote") !== 0) continue;
      var sraw = sessionStorage.getItem(sk);
      var sval; try { sval = JSON.parse(sraw); } catch(e){ sval = sraw; }
      found.push({ source:"sessionStorage", key:sk, value:sval, bytes:(sraw||"").length });
    }
  } catch(e){}

  var idb = await readIDB();
  idb.forEach(function(x){
    var b = 0; try { b = JSON.stringify(x.value).length; } catch(e){ b = -1; }
    found.push({ source:"IndexedDB", key:x.key, value:x.value, bytes:b });
  });

  FOUND = { takenAt: new Date().toISOString(), origin: location.origin,
            userAgent: navigator.userAgent, entries: found };

  var drafts = found.filter(function(f){ return String(f.key).indexOf("contiboard:draft") === 0; });
  if(!found.length){
    st.innerHTML = '<span class="warn">이 기기에서 케어노트 기록을 찾지 못했습니다.</span>';
  } else {
    st.innerHTML = '항목 <b class="big">' + found.length + '개</b>를 찾았습니다' +
                   (drafts.length ? ' (작업 기록 <b class="big">' + drafts.length + '개</b> 포함)' : '') + '.';
  }

  found.sort(function(a,b){ return (b.bytes||0) - (a.bytes||0); });
  found.forEach(function(f){
    var div = document.createElement("div"); div.className = "item";
    var s = (f.value && f.value.state) ? summarize(f.value.state) : summarize(f.value);
    var meta = f.source + " · " + kb(Math.max(f.bytes||0,0));
    if(f.value && f.value.savedAt) meta += " · 저장 " + when(f.value.savedAt);
    var body = '<div class="k">' + esc(f.key) + '</div><div class="m">' + esc(meta) + '</div>';
    if(s && s.cards){
      body += '<div class="m">제목 <b>' + esc(s.title) + '</b> · 카드 <b class="big">' + s.cards + '개</b>' +
              (s.images ? ' · 이미지 ' + s.images + '장' : '') + '</div>';
      if(s.samples.length) body += '<div class="m none">' + esc(s.samples.join(" / ")) + '</div>';
    }
    div.innerHTML = body;
    document.getElementById("out").appendChild(div);
  });

  document.getElementById("save").disabled = !found.length;
  btn.disabled = false; btn.textContent = "다시 찾기";
});

document.getElementById("save").addEventListener("click", function(){
  if(!FOUND) return;
  var blob = new Blob([JSON.stringify(FOUND)], { type: "application/json" });
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  var d = new Date(), p = function(n){ return String(n).padStart(2,"0"); };
  a.href = url;
  a.download = "carenote-복구-" + d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + "-" + p(d.getHours()) + p(d.getMinutes()) + ".json";
  document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 4000);
});
</script>
</body>
</html>
